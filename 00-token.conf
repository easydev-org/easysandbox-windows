# AgentWorker: expose the guest-only per-pod env endpoint (/env) on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    # Per-pod env for the guest launcher: WORKER_TOKEN=... and SANDBOX_PROXY=...
    # (KEY=VALUE lines). The guest does not inherit the pod env, so anything it
    # needs — the pre-auth token and the deployment HTTP proxy — travels here.
    location = /env {
        alias /run/shm/env;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # THE BOOTSTRAP (must stay separate). The golden disk carries exactly one
    # launch file, bootstrap.vbs, whose only job is to fetch a script and run it.
    # That script is oem.cmd, so oem.cmd must be reachable on its own — it cannot
    # come out of the tar, because fetching the tar is what oem.cmd does.
    location = /oem.cmd {
        alias /opt/easyworker/oem.cmd;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # ONE endpoint for the rest of the boot payload: easyworker.exe, easystream.exe and
    # oem.cmd, packed into a single tar by start.sh at container boot.
    #
    # This replaces a location per file (/worker, /easystream). One
    # request instead of two means the guest has a single place to fetch from and
    # a single failure to report, and adding a payload no longer means editing
    # nginx — start.sh owns the manifest.
    #
    # The tar is built at boot rather than baked so it can never disagree with the
    # binaries this image ships.
    #
    # NOTE: xa11y is gone — a11y/input/capture are the easystream daemon's job.
    location = /files {
        alias /run/shm/files.tar;
        default_type application/x-tar;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
