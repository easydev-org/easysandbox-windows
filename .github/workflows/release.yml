name: image

# Build the Windows sandbox image and push it to ghcr.
#
# The image EMBEDS the golden guest disk. That is the whole design: the disk is
# immutable golden state, so it belongs in a layer rather than in an artifact
# store that a pod must reach at start-up.
#
# The disk itself is not in this repository — it is a 14 GiB qcow2, published to
# ghcr as golden-windows:base (8 layers). This job pulls it, concatenates the
# layers, verifies the sha256 recorded in the manifest annotation, and hands the
# file to the image build.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["Containerfile", "sandbox.sh", "golden-disk.sh", "guest/**", "00-token.conf", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/easydev-org/sandbox-windows
  WORKER_VERSION: v0.3.8
  EASYSTREAM_VERSION: v0.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Containerfile reads disk-support/, but the UEFI identity files are
      # tracked under devtools/disk-support/ (build.sh used to stage them; a plain
      # `docker build` has no such step, and the build failed with
      #   failed to calculate checksum: "/disk-support/windows.ver": not found).
      #
      # COPY, not a symlink: Docker does not follow symlinks inside the build
      # context when resolving a COPY source, so `ln -s` produced the same
      # "not found" error it was meant to fix.
      - name: stage disk-support
        run: |
          set -euo pipefail
          ls -l devtools/disk-support/
          cp -a devtools/disk-support disk-support
          ls -l disk-support/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The golden disk is NOT downloaded here.
      #
      # The Containerfile does `FROM ghcr.io/easydev-org/golden-disk-windows:base
      # AS golden` and reassembles the qcow2 inside that stage, so BuildKit pulls
      # the pieces with its own registry client: layers are cached, retries are
      # its problem, and no second copy of 14 GiB ever lands on the runner. A
      # script that downloaded the pieces first would need ~28 GiB of scratch on
      # a machine with ~30 GiB free.
      #
      # GITHUB_TOKEN is what BuildKit authenticates with, which works because the
      # package belongs to this organisation (it used to live in a personal
      # account and returned 403 Forbidden).

      # The disk is 14 GiB; a normal runner has ~30 GB free. Prune everything
      # that is not needed so the build has room for the layer.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            WORKER_VERSION=${{ env.WORKER_VERSION }}
            EASYSTREAM_VERSION=${{ env.EASYSTREAM_VERSION }}
            RELEASE_CACHEBUST=${{ github.run_id }}
            # Overridable so a test build can point at a different disk.
            GOLDEN_DISK_IMAGE=ghcr.io/easydev-org/golden-disk-windows:base
          # The disk layer is ~14 GiB; the default gha cache would blow up.
          cache-from: type=gha
          cache-to: type=gha,mode=min
