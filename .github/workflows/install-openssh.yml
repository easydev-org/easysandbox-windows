name: install-openssh

# Add OpenSSH Server to a finished golden disk, then prove it works.
#
# WHY THIS IS ONE PYTHON DRIVER AND NOT TWENTY SHELL STEPS.
#
# The previous version was twenty `run:` blocks, and six separate failures came out of
# their quoting - a bracket class eaten by an outer shell, a backslash lost through
# docker exec -> sh -c, a $var expanded on the host instead of in the container, a YAML
# value that vanished, a backslash-dollar written as a literal, and glob rules assumed to
# be python rules. None of those were logic errors; each cost a twenty-minute run.
#
# Now every stage is a subcommand of scripts/openssh_setup.py, which calls docker through
# argv lists (shell=False), so no argument is ever reinterpreted. The parsing that decides
# pass or fail lives in functions, and `selftest` replays strings from the real logs
# without a container - so the checker can be checked before it is trusted.
#
# What the stages do:
#
#   disk     convert the artifact to raw and verify it (a truncated conversion boots and
#            then never paints; that cost two runs)
#   boot     start the container, wait for a desktop by watching the screen
#   install  winget install Microsoft.OpenSSH.Preview - the id in microsoft/winget-pkgs -
#            then configure sshd and the firewall
#   forward  listen on the port docker forwards to, relaying to the guest
#   verify   connect, banner, login - each reported, because 'no banner' used to mean all
#            three and that ambiguity wasted many rounds
#   export   stop the guest and take the disk out with its boot state
on:
  workflow_dispatch:
    inputs:
      pull_tag:
        description: "ghcr tag under easysandbox-windows-golden to start from"
        required: false
        default: "base-latest"
      bootstate_run:
        description: "Run id holding the bootstate artifact (optional)"
        required: false
        default: ""
      boot_wait:
        description: "Seconds to wait for the guest's desktop"
        required: false
        default: "1800"
      port:
        description: "sshd port in the guest, and the published host port"
        required: false
        default: "2222"
      export_disk:
        description: "Export the finished disk as a new artifact"
        required: false
        default: "yes"

permissions:
  contents: read
  actions: read
  # checks: write lets log-stream create the check run it streams into. Without it the
  # action answers 'cannot create a check run (403)' and carries on silently, which is
  # exactly how a long step once went unwatched.
  checks: write
  # packages: write is required to push the golden disk to ghcr. Without it the registry
  # answers 403 Forbidden partway into the layer upload - measured on the first publish
  # attempt, which failed on layer 1/12 after the disk itself had been built successfully.
  packages: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          # sshpass turns "a banner appeared" into "a login worked". qemu-utils for the disk
          # conversion, tesseract for reading the guest's screen.
          sudo apt-get install -y -qq qemu-utils tesseract-ocr sshpass

      # THE CHECKER IS CHECKED FIRST, in two seconds, before anything costs twenty minutes.
      - name: parser selftest
        run: python3 scripts/openssh_setup.py selftest

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # The disk comes from ghcr. A baked disk is 12 GiB and handing that between workflows
      # as an artifact was measured at over 1000 seconds without finishing; from the registry
      # it takes about 270.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.bootstate_run != '' }}
        continue-on-error: true
        with:
          name: golden-windows-bootstate
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.bootstate_run }}

      - name: place the disk
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/openssh_setup.py place
          --pull-repo easysandbox-windows-golden
          --pull-tag ${{ github.event.inputs.pull_tag }}

      - name: boot and wait for the desktop
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-boot
          interval: "20"
          command: >-
            python3 scripts/openssh_setup.py boot
            --container sshinst --port ${{ github.event.inputs.port }}
            --wait ${{ github.event.inputs.boot_wait }}

      - name: install openssh with winget
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-install
          interval: "20"
          command: >-
            python3 scripts/openssh_setup.py install
            --container sshinst --port ${{ github.event.inputs.port }}

      - name: forward the port into the guest
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-forward
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py forward
            --container sshinst --port ${{ github.event.inputs.port }}

      # Runs even if earlier steps failed: a failure above should still tell us whether the
      # port or the login worked, and reporting that is cheaper than another run.
      - name: verify ssh end to end
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-verify
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py verify
            --port ${{ github.event.inputs.port }}
            --user docker --password admin --attempts 6

      - name: export the disk
        if: always() && github.event.inputs.export_disk == 'yes'
        run: >-
          python3 scripts/openssh_setup.py export
          --container sshinst --out-name windows-openssh.qcow2

      # GHCR, NOT AN ACTIONS ARTIFACT, and the measurement is the reason.
      #
      # Handing a 14 GiB disk between workflows as an artifact took over 1000 seconds here
      # without finishing; dockur-macos recorded the same file ranging from 106 seconds to
      # "not finished after 1085". The artifact route redirects to Azure blob storage at a
      # rate no workflow can influence. ghcr is a CDN, and it is where the sandbox images
      # already expect a golden disk to come from - so this is the production path.
      #
      # The disk travels in 1 GiB layers with disk.sha256 in the manifest, so the consumer
      # verifies the reassembled file instead of trusting the transport.
      - name: publish to ghcr
        if: always() && github.event.inputs.export_disk == 'yes'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: >-
          python3 scripts/openssh_setup.py publish
          --out-name windows-openssh.qcow2
          --publish-repo ghcr.io/easydev-org/easysandbox-windows-golden
          --publish-tag ssh

      # The BOOTSTATE still goes as an artifact: it is a few hundred KB, it is useless
      # without the disk, and pulling two things from two places to boot one machine is
      # worse than pulling one from each. The disk is the big half; this is the small half.
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.export_disk == 'yes'
        with:
          name: golden-windows-openssh-bootstate
          path: out/*.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openssh-shots
          path: shots/**
          if-no-files-found: warn
          retention-days: 7

      - name: stop
        if: always()
        run: docker rm -f sshinst || true
