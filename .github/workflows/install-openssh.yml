name: install-openssh

# Add OpenSSH Server to a finished golden disk, then prove it works.
#
# WHY THIS IS ONE PYTHON DRIVER AND NOT TWENTY SHELL STEPS.
#
# The previous version was twenty `run:` blocks, and six separate failures came out of
# their quoting - a bracket class eaten by an outer shell, a backslash lost through
# docker exec -> sh -c, a $var expanded on the host instead of in the container, a YAML
# value that vanished, a backslash-dollar written as a literal, and glob rules assumed to
# be python rules. None of those were logic errors; each cost a twenty-minute run.
#
# Now every stage is a subcommand of scripts/openssh_setup.py, which calls docker through
# argv lists (shell=False), so no argument is ever reinterpreted. The parsing that decides
# pass or fail lives in functions, and `selftest` replays strings from the real logs
# without a container - so the checker can be checked before it is trusted.
#
# What the stages do:
#
#   disk     convert the artifact to raw and verify it (a truncated conversion boots and
#            then never paints; that cost two runs)
#   boot     start the container, wait for a desktop by watching the screen
#   install  winget install Microsoft.OpenSSH.Preview - the id in microsoft/winget-pkgs -
#            then configure sshd and the firewall
#   forward  listen on the port docker forwards to, relaying to the guest
#   verify   connect, banner, login - each reported, because 'no banner' used to mean all
#            three and that ambiguity wasted many rounds
#   export   stop the guest and take the disk out with its boot state
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: "Run id holding the golden-windows artifact"
        required: true
        default: "40746509253"
      boot_wait:
        description: "Seconds to wait for the guest's desktop"
        required: false
        default: "1800"
      port:
        description: "sshd port in the guest, and the published host port"
        required: false
        default: "2222"
      export_disk:
        description: "Export the finished disk as a new artifact"
        required: false
        default: "yes"

permissions:
  contents: read
  actions: read
  # checks: write lets log-stream create the check run it streams into. Without it the
  # action answers 'cannot create a check run (403)' and carries on silently, which is
  # exactly how a long step once went unwatched.
  checks: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          # sshpass turns "a banner appeared" into "a login worked". qemu-utils for the disk
          # conversion, tesseract for reading the guest's screen.
          sudo apt-get install -y -qq qemu-utils tesseract-ocr sshpass

      # THE CHECKER IS CHECKED FIRST, in two seconds, before anything costs twenty minutes.
      - name: parser selftest
        run: python3 scripts/openssh_setup.py selftest

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: golden-windows
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.artifact_run }}

      - name: place the disk
        run: python3 scripts/openssh_setup.py disk

      - name: boot and wait for the desktop
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-boot
          interval: "20"
          command: >-
            python3 scripts/openssh_setup.py boot
            --container sshinst --port ${{ github.event.inputs.port }}
            --wait ${{ github.event.inputs.boot_wait }}

      - name: install openssh with winget
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-install
          interval: "20"
          command: >-
            python3 scripts/openssh_setup.py install
            --container sshinst --port ${{ github.event.inputs.port }}

      - name: forward the port into the guest
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-forward
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py forward
            --container sshinst --port ${{ github.event.inputs.port }}

      # Runs even if earlier steps failed: a failure above should still tell us whether the
      # port or the login worked, and reporting that is cheaper than another run.
      - name: verify ssh end to end
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: openssh-verify
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py verify
            --port ${{ github.event.inputs.port }}
            --user docker --password admin --attempts 6

      - name: export the disk
        if: always() && github.event.inputs.export_disk == 'yes'
        run: python3 scripts/openssh_setup.py export --container sshinst

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openssh-shots
          path: shots/**
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.export_disk == 'yes'
        with:
          name: golden-windows-openssh
          path: |
            out/windows-openssh.qcow2
            out/windows-openssh.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: stop
        if: always()
        run: docker rm -f sshinst || true
