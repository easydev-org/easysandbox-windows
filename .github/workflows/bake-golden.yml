name: bake-golden

# Produce the Windows golden disk this image boots.
#
# PRODUCE vs CONSUME. dockur/windows produces the disk: a complete QEMU guest
# with unattended installation wired in (answer.sh rewrites the autounattend XML
# per version). This repository consumes it - Containerfile takes
# GOLDEN_DISK_IMAGE and golden-disk.sh boots an overlay - so the bake lives here
# next to what uses it, and a change to either lands in one place.
#
# WHY FOUR STEPS. GitHub has no streaming log API: /actions/jobs/{id}/logs
# redirects to a blob published only after the job ends, and is 403/404 while the
# job runs; /actions/runs/{id}/logs does not exist. The one live, documented
# progress signal is the step list from /actions/jobs/{id}, so the bake is split
# into prepare -> start -> wait -> extract. Inside wait a 30s heartbeat prints
# the qcow2 size, which is the only health signal visible from the host.
#
# amd64 only. dockurr/windows is multi-arch and would install ARM64 Windows
# natively on an aarch64 host, but ubuntu-24.04-arm provides no /dev/kvm
# (measured: udevadm trigger -> Failed to open the device kvm: Invalid
# argument). Without KVM the guest falls back to TCG where an install takes many
# hours, so arm64 needs a self-hosted aarch64 runner.
#
# Manual only: a 60-90 minute install producing a ~30 GiB disk.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows version for dockur (11, 10, 2022 ...)"
        required: false
        default: "11"
      disk_size:
        description: "qcow2 capacity passed to dockur"
        required: false
        default: "64G"

permissions:
  contents: read
  actions: read
  # checks: write is what lets log-stream create and update the check run it
  # streams into. Without it the action answers
  #   cannot create a check run (403): Resource not accessible by integration
  # and carries on without streaming - measured on the macOS bake, where the
  # missing permission was the first thing that went wrong.
  checks: write
  # packages: write is required to push the golden disk to ghcr. Without it the registry
  # answers 403 Forbidden partway into the layer upload - measured on the first publish
  # attempt, which failed on layer 1/12 after the disk itself had been built successfully.
  packages: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ github.event.inputs.version }}
      DISK_SIZE: ${{ github.event.inputs.disk_size }}
      STORAGE: ${{ github.workspace }}/storage
      OUT: ${{ github.workspace }}/out/windows.qcow2
    steps:
      - uses: actions/checkout@v4

      # A GitHub runner has ~14 GB of SSD and Windows 11 needs tens of GiB, so
      # rule out "the container died for lack of space" before trusting any other
      # diagnosis. These two steps report the disk, then free what the runner image
      # ships and a Windows bake never touches.
      # qemu-utils provides qemu-img, which the extract step needs to convert the
      # raw dockur disk into the qcow2 the image expects. Without it the bake gets
      # all the way to extraction and then dies with 'qemu-img: command not found'
      # (exit 127) - exactly what the first otherwise-successful run did.
      - name: tooling
        run: |
          sudo apt-get update -qq
          # sshpass is what turns the ssh check from "the port is open" into "a
          # login actually works". Keys would have to be generated and injected
          # before the install, which the OEM payload does not do - the account has
          # a password, so the check uses it.
          # tesseract reads the framebuffer dump, so the wait stage can tell
          # 'Installing Windows 11 - 84%' from a desktop. Disk size could not.
          sudo apt-get install -y -qq qemu-utils sshpass tesseract-ocr
          qemu-img --version | head -1
      - name: disk before
        run: df -h / "" || true

      - name: free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc                       /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h / "" || true
      - name: bake prepare
        run: sudo -E python3 scripts/bake_golden.py prepare
      # Streamed too, not just the long wait. This step is where a bad docker run
      # dies, and it died there twice with no readable log: the failure was a syntax
      # error in the continuation, invisible until the arguments it lost were
      # counted. Streaming makes that immediate.
      - name: bake start container
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: bake-start
          interval: "10"
          command: sudo -E python3 scripts/bake_golden.py start
      # Streamed into a check run, because this step is up to 90 minutes long and
      # GitHub publishes no log for a running job - /actions/jobs/{id}/logs is a
      # redirect to a blob that only appears when the job ends, and answers
      # 403/404 until then. A check run's output.text is readable immediately, so
      # log-stream keeps it current from the script's own stdout and a reader can
      # follow the install while it happens.
      - name: bake wait for install
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: bake-wait
          interval: "20"
          command: sudo -E python3 scripts/bake_golden.py wait
      # Capture what the guest is showing before it is stopped, the same way the
      # macOS bake does. Disk size cannot distinguish "still installing" from
      # "finished" or "stuck on a prompt"; a framebuffer dump can.
      - name: bake screenshot
        if: always()
        run: |
          mkdir -p screenshots
          sudo -E python3 scripts/bake_golden.py shot
          sudo chown -R "$(id -u):$(id -g)" screenshots || true
          ls -la screenshots || true
      # Runs even when wait failed. A disk that reached a desktop but whose ssh did
      # not come up is still worth having - it is a working Windows install - and
      # three runs have now thrown away a finished 12 GiB image because a port check
      # failed after the install had already succeeded.
      - name: bake extract disk
        if: always()
        run: sudo -E python3 scripts/bake_golden.py extract
      # Publish to ghcr as well as uploading the artifact. The artifact is what the next
      # stage downloads when it runs immediately after; ghcr is where the disk is kept.
      # Two tags: base-<stamp> for this build forever, base-latest for whoever wants the
      # current one. ghcr_push_disk.py puts both on one manifest and reads each back.
      - name: publish to ghcr
        if: always()
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: >-
          sudo -E python3 scripts/bake_golden.py publish
          --out ${{ github.workspace }}/out/windows.qcow2
          --publish-repo ghcr.io/easydev-org/easysandbox-windows-golden
          --publish-tag base

      - name: debug container
        if: failure()
        run: |
          sudo docker ps -a || true
          sudo docker logs --tail 200 winbake 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bake-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 7
      # BOOTSTATE ONLY. The disk itself goes to ghcr - 12 GiB through an Actions artifact
      # was measured at over 1000 seconds and is the reason this pipeline moved to the
      # registry at all. The bootstate is a few hundred KB and useless without the disk, so
      # it travels here and the two are pulled from wherever each is cheap.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-windows-bootstate
          path: ${{ github.workspace }}/out/*.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30
