name: verify-golden

# Boot a disk a previous run exported, and prove it still works.
#
# WHY THIS EXISTS. A bake, or an install-openssh run, ends by exporting a disk. Until this
# workflow existed, nothing had ever booted one of those exports - the SSH login had only
# been proven against the live VM that produced it. A disk that boots is the deliverable,
# and "the machine that made it could log in" is not the same claim.
#
# Two mistakes that wasted the most rounds are deliberately not repeated here:
#
#   MANUAL=Y is NOT used. It forces Secure Boot on for win11, and a disk installed without
#   Secure Boot is refused by the firmware, which falls through to the DVD - showing a
#   Windows Setup screen that looks exactly like a broken disk. That misdiagnosis cost
#   several runs. storage/windows.boot is what tells dockur the disk is installed.
#
#   The disk is converted to RAW first. dockur opens /storage/data.img with format=raw, so
#   handing it qcow2 makes QEMU read metadata as a partition table, find no disk, and boot
#   the ISO instead - again indistinguishable from a broken disk at the screen.
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: "Run id holding the disk artifact"
        required: true
        default: "41007310155"
      artifact_name:
        description: "Artifact name holding the disk"
        required: false
        default: "golden-windows-openssh"
      port:
        description: "sshd port to reach"
        required: false
        default: "2222"
      boot_wait:
        description: "Seconds to wait for the desktop"
        required: false
        default: "1800"
      expect_login:
        description: "yes = require an SSH login (disk has sshd); no = desktop only"
        required: false
        default: "yes"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils tesseract-ocr sshpass

      - name: parser selftest
        run: python3 scripts/openssh_setup.py selftest

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.artifact_run }}

      - name: place the disk
        run: python3 scripts/openssh_setup.py disk

      - name: boot and wait for the desktop
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: verify-boot
          interval: "20"
          command: >-
            python3 scripts/openssh_setup.py boot
            --container verifydisk --port ${{ github.event.inputs.port }}
            --wait ${{ github.event.inputs.boot_wait }}

      - name: expose the port
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: verify-forward
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py forward
            --container verifydisk --port ${{ github.event.inputs.port }}

      - name: prove ssh works from this host
        if: always() && github.event.inputs.expect_login == 'yes'
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: verify-ssh
          interval: "15"
          command: >-
            python3 scripts/openssh_setup.py verify
            --port ${{ github.event.inputs.port }}
            --user docker --password admin --attempts 6

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-shots
          path: shots/**
          if-no-files-found: warn
          retention-days: 7

      - name: stop
        if: always()
        run: docker rm -f verifydisk || true
